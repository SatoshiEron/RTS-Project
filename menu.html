<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expansion RTS — Меню</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #0a0d14;
    }

    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #menuPanel {
      position: relative;
      z-index: 1;
      background: rgba(10, 15, 30, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 32px;
      padding: 48px 56px;
      min-width: 380px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
      transition: all 0.3s ease;
    }

    #logo {
      font-size: 38px;
      font-weight: 700;
      color: #e0e6f5;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-shadow: 0 0 40px rgba(74, 158, 255, 0.15);
    }
    #logo span {
      color: #4a9eff;
      text-shadow: 0 0 60px rgba(74, 158, 255, 0.3);
    }

    #subtitle {
      font-size: 13px;
      color: #8892b0;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 20px;
    }

    .menu-btn {
      display: block;
      width: 100%;
      padding: 14px 0;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      color: #e0e6f5;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
    }

    .menu-btn:hover {
      background: rgba(74, 158, 255, 0.12);
      border-color: rgba(74, 158, 255, 0.25);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(74, 158, 255, 0.08);
    }

    .menu-btn.primary {
      background: #4a9eff;
      border-color: #4a9eff;
      color: #fff;
      box-shadow: 0 4px 20px rgba(74, 158, 255, 0.2);
    }

    .menu-btn.primary:hover {
      background: #5aafff;
      border-color: #5aafff;
      box-shadow: 0 8px 40px rgba(74, 158, 255, 0.35);
      transform: translateY(-2px);
    }

    .menu-btn.danger {
      color: #ff6666;
    }

    .menu-btn.danger:hover {
      background: rgba(255, 80, 80, 0.12);
      border-color: rgba(255, 80, 80, 0.25);
    }

    #version {
      margin-top: 24px;
      font-size: 12px;
      color: #445566;
      letter-spacing: 1px;
    }

    #loadingOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 24px;
    }
    #loadingOverlay.active {
      display: flex;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.06);
      border-top: 3px solid #4a9eff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loadingText {
      color: #8892b0;
      font-size: 14px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText">Загрузка...</div>
  </div>

  <div id="menuPanel">
    <div id="logo">Expansion<span>RTS</span></div>
    <div id="subtitle">Стратегия на карте</div>

    <button class="menu-btn primary" id="btnNewGame">⚔️ Новая игра</button>
    <button class="menu-btn" id="btnLoadGame">💾 Загрузить</button>
    <button class="menu-btn" id="btnSettings">⚙️ Настройки</button>
    <button class="menu-btn danger" id="btnExit">✕ Выход</button>

    <div id="version">v0.1.0 Alpha</div>
  </div>

  <script>
    // ============================================================
    //  НОВЫЙ ФОН — «ТУМАН ВОЙНЫ» (геометрия + партиклы)
    // ============================================================

    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ===== 1. ПАРТИКЛЫ =====
    const particles = [];
    const NUM_PARTICLES = 160;

    for (let i = 0; i < NUM_PARTICLES; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
        radius: Math.random() * 2 + 0.5,
        alpha: Math.random() * 0.4 + 0.1,
        phase: Math.random() * Math.PI * 2
      });
    }

    // ===== 2. ОПОРНЫЕ ТОЧКИ ДЛЯ ЛИНИЙ =====
    const points = [];
    const NUM_POINTS = 10;
    for (let i = 0; i < NUM_POINTS; i++) {
      points.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.08,
        vy: (Math.random() - 0.5) * 0.08,
        radius: 3 + Math.random() * 6
      });
    }

    // ===== 3. ГЛАВНЫЙ ЦИКЛ =====
    function draw(t) {
      ctx.clearRect(0, 0, W, H);

      // ---- Градиентный фон ----
      const grad = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, W * 0.8);
      grad.addColorStop(0, '#1b2233');
      grad.addColorStop(0.6, '#0f121a');
      grad.addColorStop(1, '#05060a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // ---- Сетка (геометрия) ----
      ctx.strokeStyle = 'rgba(74, 158, 255, 0.04)';
      ctx.lineWidth = 0.5;
      const step = 60;
      for (let x = 0; x < W; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y < H; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // ---- Движущиеся опорные точки и линии ----
      for (const p of points) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
      }

      // Линии между точками (если расстояние < 200px)
      ctx.strokeStyle = 'rgba(74, 158, 255, 0.06)';
      ctx.lineWidth = 0.8;
      for (let i = 0; i < points.length; i++) {
        for (let j = i + 1; j < points.length; j++) {
          const dx = points[i].x - points[j].x;
          const dy = points[i].y - points[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 200) {
            ctx.beginPath();
            ctx.moveTo(points[i].x, points[i].y);
            ctx.lineTo(points[j].x, points[j].y);
            ctx.stroke();
          }
        }
      }

      // ---- Партиклы ----
      for (const p of particles) {
        p.x += p.vx + Math.sin(t * 0.0005 + p.phase) * 0.02;
        p.y += p.vy + Math.cos(t * 0.0007 + p.phase) * 0.02;

        if (p.x < 0) p.x = W;
        if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H;
        if (p.y > H) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 215, 255, ${p.alpha})`;
        ctx.fill();
      }

      // ---- Свечение по центру (под логотипом) ----
      const glow = ctx.createRadialGradient(W / 2, H * 0.35, 0, W / 2, H * 0.35, W * 0.3);
      glow.addColorStop(0, 'rgba(74, 158, 255, 0.06)');
      glow.addColorStop(1, 'rgba(74, 158, 255, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);

      requestAnimationFrame(draw);
    }

    draw(0);

    // ============================================================
    //  КНОПКИ МЕНЮ
    // ============================================================

    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');

    document.getElementById('btnNewGame').addEventListener('click', () => {
      loadingOverlay.classList.add('active');
      loadingText.textContent = 'Загрузка карты...';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 800);
    });

    document.getElementById('btnLoadGame').addEventListener('click', () => {
      loadingOverlay.classList.add('active');
      loadingText.textContent = 'Поиск сохранений...';
      setTimeout(() => {
        alert('💾 Функция загрузки будет доступна в следующей версии.');
        loadingOverlay.classList.remove('active');
      }, 600);
    });

    document.getElementById('btnSettings').addEventListener('click', () => {
      alert('⚙️ Настройки пока в разработке.');
    });

    document.getElementById('btnExit').addEventListener('click', () => {
      if (confirm('Выйти из игры?')) {
        window.close();
      }
    });
  </script>
</body>
</html>
